<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>宿舍电量监控 | ResearchHelper</title>
    <meta name="color-scheme" content="light dark" />

    <!-- 独立样式 -->
    <link rel="stylesheet" href="./power.css" />

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <div class="wrapper">
      <!-- 父级大卡片 -->
      <div class="card outer-card">
        <h2 class="card-title">电量统计</h2>

        <!-- 网格：左当前电量 / 右折线图 -->
        <div class="inner-grid">
          <!-- 左侧：旋转环 -->
          <div class="sub-card current-card">
            <div class="ring">
              <div class="current-power">
                <span id="powerValue">--</span>
                <span class="unit">kWh</span>
              </div>
            </div>
            <div id="currentTime">--</div>
          </div>

          <!-- 右侧：折线图 -->
          <div class="sub-card chart-card">
            <canvas id="powerChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 脚本：拉取数据并更新页面 -->
    <script src="./power.js" defer></script>
  </body>
</html>
