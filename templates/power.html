<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>宿舍电量监控 | ResearchHelper</title>
    <!-- 图标 & 继承 about 页面配色 → 直接沿用现有 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./about.css" />
    <style>
      /* ------- 电量表格专用微样式 ------- */
      table.power-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      .power-table th,
      .power-table td {
        border: 1px solid #e0e0e0;
        padding: 8px 10px;
        text-align: center;
      }
      .power-table th {
        background: #f4f6f8;
      }
      body.dark-mode .power-table th {
        background: #383838;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>宿舍剩余电量</h1>
      <p>最近 100 条记录，页面每 <code>30 min</code> 自动刷新</p>

      <table class="power-table" id="powerTable">
        <thead>
          <tr>
            <th>时间</th>
            <th>剩余电量 (kWh)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <a href="#" class="button" id="refreshBtn"
        ><i class="fa-solid fa-arrows-rotate"></i>&nbsp;手动刷新</a
      >
      <br />
      <a href="./about.html" class="link"
        ><i class="fa-solid fa-circle-info"></i>&nbsp;关于 ResearchHelper</a
      >
    </div>

    <script>
      // 继承暗色 / 亮色模式
      const theme = localStorage.getItem("theme") || "light";
      document.body.classList.add(theme + "-mode");

      async function fetchPower() {
        try {
          const res = await fetch("/api/power");
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          renderTable(data);
        } catch (err) {
          console.error(err);
          alert("无法获取电量数据：" + err.message);
        }
      }

      function renderTable(data) {
        const tbody = document.querySelector("#powerTable tbody");
        tbody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${row.time}</td><td>${row.power}</td>`;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("refreshBtn").addEventListener("click", (e) => {
        e.preventDefault();
        fetchPower();
      });

      fetchPower(); // 首次加载
      setInterval(fetchPower, 30 * 60 * 1000); // 30 min 轮询
    </script>
  </body>
</html>
